services:
  # ─── Infrastructure ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: webhook_processor
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Backend API ────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    command: node dist/main.js
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/webhook_processor
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BACKEND_PORT: 3001
      MAX_ATTEMPTS: 5
      RETRY_DELAY_MS: 1000
      PROCESSING_STALE_TIMEOUT_SECONDS: 30
      OUTBOX_POLL_INTERVAL_MS: 1000
      WORKER_ID: backend
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ─── Workers ────────────────────────────────────────────────────
  worker-1:
    build:
      context: .
      dockerfile: Dockerfile
    command: node dist/worker-main.js
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/webhook_processor
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAX_ATTEMPTS: 5
      RETRY_DELAY_MS: 1000
      PROCESSING_STALE_TIMEOUT_SECONDS: 30
      WORKER_ID: worker-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  worker-2:
    build:
      context: .
      dockerfile: Dockerfile
    command: node dist/worker-main.js
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/webhook_processor
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAX_ATTEMPTS: 5
      RETRY_DELAY_MS: 1000
      PROCESSING_STALE_TIMEOUT_SECONDS: 30
      WORKER_ID: worker-2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
